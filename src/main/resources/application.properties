# ===================================
# JWT CONFIG
# ===================================
jwt.secret=tse-erp-super-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm
jwt.access-token-expiry=3600000
jwt.refresh-token-expiry=604800000

# 900000ms   = 15 minutes (access token)
# 604800000ms = 7 days (refresh token)

# ===================================
# SECURITY CONFIG
# ===================================
security.rate-limit.max-attempts-per-ip=5
security.rate-limit.max-attempts-per-account=10
security.rate-limit.window-seconds=10
security.self-register.enabled=true
security.self-register.auto-activate=false
security.self-register.max-per-ip-per-hour=5
security.self-register.default-bg-id=1
security.self-register.default-bu-id=1
security.self-register.default-role-id=2
security.self-register.default-user-type-id=1

